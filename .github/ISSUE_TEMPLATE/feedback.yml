name: 反馈 / 建议
description: 提交 BUG 报告或功能建议
title: "[反馈] "
labels: ["feedback"]
assignees: []

body:
  # ========== 类型选择（必填） ==========
  - type: dropdown
    id: type
    attributes:
      label: 反馈类型
      description: 请选择本次反馈的类型
      options:
        - 🐛 BUG
        - 💥 严重 BUG
        - 💡 功能建议
        - 📝 其他
    validations:
      required: true

  # ========== 版本 ==========
  - type: input
    id: version
    attributes:
      label: 启动器版本
      description: 你用的是哪个版本？（在启动器"关于"页面可以看到）
      placeholder: "比如 v0.1.0"
    validations:
      required: true

  # ========== 系统 ==========
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - Windows 8.1
        - Windows 7
        - macOS
        - Linux
    validations:
      required: true

  # ========== 问题描述 ==========
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 详细描述你遇到的问题 / 建议
      placeholder: |
        1. 我做了什么
        2. 期望发生什么
        3. 实际发生了什么
    validations:
      required: true

  # ========== 复现步骤 ==========
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如果你是 BUG，怎么复现？
      placeholder: |
        1. 打开启动器
        2. 点击 "XXX"
        3. 出现 "YYY"
      render: markdown
    validations:
      required: false

  # ========== 日志 / 截图 ==========
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 有日志或截图的话，贴在这里（直接拖图片到框里）
      placeholder: "（拖入图片 / 粘贴日志）"
      render: markdown
    validations:
      required: false

  # ========== 确认清单 ==========
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过现有的 Issues，确认这个问题没有被报告过
          required: true
        - label: 我使用的是最新版本
          required: true
