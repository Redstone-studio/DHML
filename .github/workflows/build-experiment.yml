name: Build Experiment v3.0 (Onefile, Password Protected)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release 版本号'
        required: true
        default: 'v3.0.0-exp'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 requests pyinstaller

      - name: Copy source
        shell: pwsh
        run: Copy-Item "experiments/MC_LuncherTEST-3.0.py" -Destination "MC_LuncherTEST-3.0.py"

      - name: Build (onefile)
        shell: pwsh
        run: pyinstaller --noconfirm --windowed --onefile --name "RedstoneLauncher-Experiment-v3.0" "MC_LuncherTEST-3.0.py"

      # 用 7-Zip 加密打包
      - name: Zip with password
        shell: pwsh
        run: |
          # 安装 7-Zip（如果没装）
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y
          }
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe"
          }
          # 加密压缩
          & $sevenZip a -tzip -p"${{ secrets.ZIP_PASSWORD }}" -mem=AES256 "RedstoneLauncher-Experiment-v3.0-encrypted.zip" "dist\RedstoneLauncher-Experiment-v3.0.exe"
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}

      - name: Show files
        shell: pwsh
        run: |
          dir dist
          dir *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "RedstoneLauncher Experiment ${{ inputs.version }} (Encrypted)"
          body: |
            ## 🧪 实验版 RedstoneLauncher ${{ inputs.version }}

            **⚠️ 此版本为加密发布，仅供作者本人使用。**

            ### 说明
            - 这是**实验程序 v3.0** 的打包版本（单文件）
            - 压缩包**已加密**，只有作者知道密码
            - 普通用户请从源码自行打包（见 README）

            ### 对于作者
            解压密码在 GitHub Secret `ZIP_PASSWORD` 里。

            ### 对于其他人
            如果你需要这个程序：
            1. 从 [源码](https://github.com/kongxia114/Redstone-Launcher/blob/main/experiments/MC_LuncherTEST-3.0.py) 自行打包
            2. 或等待正式版 `Redstone Launcher`
