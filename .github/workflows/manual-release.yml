name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.0.1-alpha）'
        required: true
        default: 'v0.0.1-alpha'
      prerelease:
        description: '是否为预发布版'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      # ---------- 关键修正：单行，避免 PowerShell 的 ^ 换行符坑 ----------
      - name: Build
        run: pyinstaller --noconfirm --windowed --name MCLuncher --add-data "assets;assets" main.py

      - name: Zip
        run: Compress-Archive -Path dist/MCLuncher/* -DestinationPath MCLuncher-${{ inputs.version }}-win64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "MC Launcher ${{ inputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          files: MCLuncher-${{ inputs.version }}-win64.zip
          generate_release_notes: true
